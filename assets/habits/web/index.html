<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky Habits</title>
<style>
  :root { --ink:#111; --paper:#fff; --soft:#f1f1ee; --line:#d8d8d2; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         color:var(--ink); background:var(--soft); }
  header { background:var(--ink); color:var(--paper); padding:18px 16px 14px; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header p { margin:4px 0 0; opacity:.75; font-size:13px; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  label.name { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=text] { width:100%; font:inherit; padding:10px 12px; border:2px solid var(--ink);
                     border-radius:10px; background:var(--paper); }
  .habit { background:var(--paper); border:2px solid var(--ink); border-radius:14px;
           padding:12px; margin-top:14px; }
  .row { display:flex; align-items:center; gap:10px; }
  .num { width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--paper);
         display:grid; place-items:center; font-weight:700; flex:none; }
  .tools { margin-left:auto; display:flex; gap:6px; }
  .tools button { width:36px; height:36px; border-radius:9px; border:2px solid var(--ink);
                  background:var(--paper); font-size:16px; }
  .bunnies { display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px; }
  .bunnies button { flex:none; width:64px; height:64px; border-radius:10px; padding:2px;
                    border:2px solid var(--line); background:var(--paper); }
  .bunnies button[aria-pressed=true] { border:3px solid var(--ink); }
  .bunnies img { width:100%; height:100%; image-rendering:pixelated; }
  .text { margin-top:10px; }
  .add { width:100%; margin-top:14px; padding:12px; border:2px dashed var(--ink);
         border-radius:14px; background:transparent; font:inherit; font-weight:600; }
  .save { position:sticky; bottom:0; padding:12px 16px 16px; background:linear-gradient(transparent, var(--soft) 30%); }
  .save button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--ink);
                 color:var(--paper); font:inherit; font-weight:700; font-size:17px; }
  .status { text-align:center; font-size:13px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<header>
  <h1>Sticky Habits</h1>
  <p>Edit your routine here. Tap Save and the Sticky updates.</p>
</header>
<main>
  <label class="name" for="name">Routine name</label>
  <input id="name" type="text" maxlength="31">
  <div id="list"></div>
  <button class="add" id="add">+ Add habit</button>
</main>
<div class="save">
  <button id="save">Save to Sticky</button>
  <div class="status" id="status"></div>
</div>
<script>
// ART is replaced by the firmware build with data: URIs of the bunny art.
const ART = window.HABIT_ART || [];
const ICON_NAMES = ["Bunny", "Sun salutation", "Workout", "Breakfast", "Writing"];
const MAX = 12;
let state = { name: "Morning routine", habits: [] };

function render() {
  document.getElementById("name").value = state.name;
  const list = document.getElementById("list");
  list.innerHTML = "";
  state.habits.forEach((habit, i) => {
    const card = document.createElement("div");
    card.className = "habit";
    card.innerHTML = `
      <div class="row">
        <div class="num">${i + 1}</div>
        <strong>Page ${i + 1} of ${state.habits.length}</strong>
        <div class="tools">
          <button aria-label="Move up" data-act="up">&#8593;</button>
          <button aria-label="Move down" data-act="down">&#8595;</button>
          <button aria-label="Delete" data-act="del">&#10005;</button>
        </div>
      </div>
      <input class="text" type="text" maxlength="95" placeholder="Describe the habit">
      <div class="bunnies"></div>`;
    const text = card.querySelector(".text");
    text.value = habit.text;
    text.oninput = () => { habit.text = text.value; };
    const bunnies = card.querySelector(".bunnies");
    ICON_NAMES.forEach((label, icon) => {
      const b = document.createElement("button");
      b.setAttribute("aria-pressed", String(habit.icon === icon));
      b.title = label;
      b.innerHTML = ART[icon] ? `<img alt="${label}" src="${ART[icon]}">` : label;
      b.onclick = () => { habit.icon = icon; render(); };
      bunnies.appendChild(b);
    });
    card.querySelectorAll(".tools button").forEach(btn => btn.onclick = () => {
      const act = btn.dataset.act, h = state.habits;
      if (act === "del") h.splice(i, 1);
      if (act === "up" && i > 0) [h[i - 1], h[i]] = [h[i], h[i - 1]];
      if (act === "down" && i < h.length - 1) [h[i + 1], h[i]] = [h[i], h[i + 1]];
      render();
    });
    list.appendChild(card);
  });
  document.getElementById("add").disabled = state.habits.length >= MAX;
}

document.getElementById("name").oninput = e => { state.name = e.target.value; };
document.getElementById("add").onclick = () => {
  state.habits.push({ text: "", icon: 0 });
  render();
};
document.getElementById("save").onclick = async () => {
  const status = document.getElementById("status");
  status.textContent = "Saving...";
  try {
    const res = await fetch("/api/habits", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state) });
    status.textContent = res.ok ? "Saved. Check your Sticky!" : "Save failed.";
  } catch (e) { status.textContent = "Not connected to the Sticky."; }
};

fetch("/api/habits").then(r => r.json()).then(data => { state = data; render(); })
  .catch(() => {
    state.habits = [
      { text: "Do 3 sun salutations", icon: 1 },
      { text: "Lift weights / do pull-ups", icon: 2 },
      { text: "Eat breakfast", icon: 3 },
      { text: "Write morning pages", icon: 4 } ];
    render();
  });
</script>
</body>
</html>
